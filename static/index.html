<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saffron Palm Front Desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="banner">🎧 Please use headphones, or tap 🎙️ to mute while the agent talks. Otherwise it hears itself and interrupts.</div>

  <header>
    <h1>The Saffron Palm <span>Dubai Marina · Front Desk</span></h1>
    <div class="controls">
      <span id="status" class="pill">idle</span>
      <div class="meter"><div id="level"></div></div>
      <button id="end" class="end" hidden>End session</button>
      <button id="mic" class="mic" aria-label="Start call, or mute and unmute">🎙️</button>
    </div>
  </header>

  <div id="error" class="error" hidden></div>

  <main>
    <section class="panel">
      <h2>Conversation</h2>
      <div id="transcript" class="transcript"></div>
      <form id="text-form">
        <input id="text" dir="auto" placeholder="Type a message…" autocomplete="off">
        <button>Send</button>
      </form>
    </section>

    <section class="panel">
      <h2>Front Desk</h2>
      <div id="tools" class="tools"></div>
      <h2>Bookings</h2>
      <ul id="bookings" class="bookings"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
